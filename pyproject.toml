[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[project]
name = "pydal-stubs"
version = "0.2.0"
description = "PEP 561 type stubs for pyDAL"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Robin van der Noord", email = "robin.vdn@educationwarehouse.nl" }]
keywords = ["pydal", "stubs", "typing", "pep561", "type-hints"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Stubs Only",
]

# This is a *partial* stub package: modules without a .pyi here fall back to
# pyDAL's own source, so the runtime package has to be installed alongside it.
dependencies = ["pydal>=20251012.3"]

[project.urls]
Homepage = "https://github.com/robinvandernoord/pydal-stubs"
Issues = "https://github.com/robinvandernoord/pydal-stubs/issues"
Source = "https://github.com/robinvandernoord/pydal-stubs"

[tool.uv.build-backend]
# PEP 561 requires the directory to be named "<package>-stubs" verbatim, which is
# not a valid module name. uv_build handles that natively: it packages
# src/pydal-stubs/ as-is and, for editable installs, puts src/ on sys.path so
# mypy and Pyright still find the *-stubs directory.
module-name = "pydal-stubs"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"

[tool.vommit]
allow_breaking_bang = true
allow_breaking_footer = true
prerelease_token = "beta"
confirm = true
ignore = []

[tool.vommit.git]
enabled = true
origin = "origin"
branch = "master"
on_wrong_branch = "error"
tag_format = "v{version}"
commit_format = "{version}"

[tool.vommit.changelog]
enabled = true
file = "CHANGELOG.md"
include_prereleases = false
placeholder = "<!-- next-version-placeholder -->"
placeholder_regex = "^<!\\-\\-[ \\t]+next\\-version\\-placeholder[ \\t]+\\-\\->$"
entry_title_format = "## v{version} ({date:%Y-%m-%d})"

[tool.vommit.changelog.levels]
break = "Breaking Change{s}"
feat = "Feature{s}"
fix = "Fix{es}"
perf = "Performance"
docs = "Documentation"

[tool.vommit.pypi]
enabled = true
use_keyring = true

[tool.vommit.commands]
clean = "rm -rf ./dist"
build = "uv build"
publish = "uv publish"
post_publish = ""

[tool.vommit.version_bump_map]
break = "major"
feat = "minor"
fix = "patch"
perf = "patch"
